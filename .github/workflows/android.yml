name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          shopt -s dotglob
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP bulundu: $ZIP_FILE, çıkartılıyor..."
            unzip -q "$ZIP_FILE" -d extracted/
            if [ -d "extracted/app" ]; then
              cp -r extracted/* .
            else
              SUBDIR=$(find extracted -maxdepth 1 -mindepth 1 -type d | head -n 1)
              if [ -n "$SUBDIR" ]; then
                cp -r $SUBDIR/* .
              fi
            fi
            rm -rf extracted
          fi
          # Secrets eklentisinin çökmemesi için boş .env ve .env.example oluşturuyoruz
          touch .env .env.example

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermoESP-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
